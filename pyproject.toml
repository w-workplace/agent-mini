[project]
name = "coding-agent"
version = "0.6.0"
description = "A minimal, dependency-free coding agent built on OpenAI-compatible tool calling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# No runtime dependencies: everything is standard library.
dependencies = []

[project.scripts]
coding-agent = "coding_agent.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coding_agent"]

[tool.setuptools.package-data]
coding_agent = ["default_skills/*/*.md"]
